<style>
:root{color-scheme:dark;--green:#62e6d3;--glow:#32b8a8;--brightness:.65;--rest-brightness:1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--green);font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}button,select{font:inherit}button,select{touch-action:manipulation}#glass{position:fixed;inset:0;display:grid;place-items:center;background:#000}#face{position:relative;width:min(100vw,calc(100vh * 810 / 1392));max-height:100vh;aspect-ratio:810/1392;filter:brightness(calc(var(--brightness)*var(--rest-brightness)));transition:filter .2s ease}#simple,#live{position:absolute;inset:0;width:100%;height:100%}#simple{--eye-scale:1.15;display:grid;place-items:center;translate:0 var(--eye-inset-y,0px);transform:translate(var(--drift-x,0px),var(--drift-y,0px));transition:transform 4s ease}.glasses-scene{display:block;width:calc(100% * var(--eye-scale));height:auto;overflow:visible}.glasses-frame{fill:url(#glasses-frame-ink) #8f989d;fill-rule:evenodd;stroke:none}.eye-shape{fill:var(--green)}.lens-glint{fill:#fff;pointer-events:none}body[data-rest-stage=dim]{--rest-brightness:.18}body[data-rest-stage=doze]{--rest-brightness:0}body.night{--brightness:.3}body.live2d{--brightness:1}#live{display:none}body.live2d #simple{visibility:hidden}body.live2d #live{display:block}#state,#vision-status{font-size:12px;color:#a9bcb7}#lock-hint{display:none;position:fixed;top:12px;left:12px;font-size:12px}body.touch-locked.controls-visible #lock-hint{display:block}body[data-state=working] #state{color:#f0cf73}
</style>
<style>
body.cooling{--rest-brightness:1;--brightness:.18}body.cooling #live{display:none}body.cooling #simple{visibility:visible;transition:none}body.cooling #face{transition:none}
#settings-open{position:fixed;z-index:5;right:calc(100vw - var(--usable-width) + 12px);bottom:16px;width:40px;height:40px;border:1px solid #b8d8cf42;border-radius:50%;background:#0c171ab8;color:#b6d1ca;font:20px system-ui;opacity:0;pointer-events:none;transition:opacity .3s}body.controls-visible #settings-open{opacity:.8;pointer-events:auto}body.settings-open #settings-open,body.messages-open #settings-open{visibility:hidden}body.call-active #settings-open{bottom:76px;z-index:10}
#settings-panel[hidden]{display:none}#settings-panel{position:fixed;inset:0;height:var(--panel-height);z-index:20;background:#0c171ac4;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);color:#e0f5f0;touch-action:pan-y}
#settings-surface{width:var(--usable-width);height:100%;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px;display:flex;flex-direction:column;gap:16px;touch-action:pan-y}
#settings-surface header{display:flex;align-items:center;justify-content:space-between;color:#b6d1ca;font-size:15px}
#settings-surface button,#settings-surface select,#settings-surface input{font:14px system-ui;color:#e0f5f0;background:#03131199;border:1px solid #b5dfd455;border-radius:10px;padding:9px;min-height:40px;max-width:100%;touch-action:manipulation}
#settings-surface button:disabled,#settings-surface select:disabled{opacity:.45}#settings-surface button[aria-pressed=true]{border-color:#79e1cd}
#settings-close{order:-1;width:38px;font-size:22px!important;border-radius:50%!important}#control-bar{display:grid;gap:8px;grid-template-columns:1fr 1fr}#vision-toggle{grid-column:1/-1;width:100%}
#outfit-setting{border:0;margin:0;padding:0;min-width:0}#outfit-setting legend{font-size:14px;margin-bottom:9px}#outfit-options{display:flex;flex-wrap:wrap;gap:8px}#outfit-options button{min-width:80px}#outfit-options button[aria-pressed=true]{background:#163c35;border-color:#79e1cd}#watch-form,#silent-form{display:grid;gap:10px}#watch-form>div{display:flex;gap:4px;align-items:center}#watch-form input{min-width:0;width:90px}#watch-form select{min-width:0;width:88px}#watch-settings summary{padding:7px 0;cursor:pointer}#watch-settings p{font-size:12px;line-height:1.6;margin:0}#silent-form>div{display:flex;align-items:center;gap:7px}#silent-form input{min-width:0;flex:1;width:calc((100% - 24px)/2);font-size:13px}#off-display-control,#close-control{display:flex;align-items:center;justify-content:space-between;font-size:14px}#settings-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}body.all-off #subtitle,body.black-screen #face{visibility:hidden}
</style>
<style>
:root{--usable-width:100vw;--panel-height:100dvh}
#glass{right:auto;width:var(--usable-width)}
#caption-layer{position:fixed;inset:0;z-index:12;pointer-events:none}

#message-panel[hidden]{display:none}#message-panel{position:fixed;inset:0;z-index:20;height:var(--panel-height);background:#0c171ac4;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);touch-action:pan-y;color:#e0f5f0}
#message-surface{width:var(--usable-width);height:100%;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
#message-surface header{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#b6d1ca}

#message-list{list-style:none;margin:0;padding:4px 2px;flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
#message-list li{font-size:clamp(16px,4.6vw,21px);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 16px;padding:10px 11px;border:1px solid #c0dfd41c;border-radius:13px;background:#d9fff309}

#message-form label{font-size:13px;color:#aecac2}#message-form>div{display:flex;align-items:end;gap:8px;margin-top:5px}
#message-input{font:16px/1.5 system-ui;resize:none;min-width:0;flex:1;max-height:130px;border:1px solid #b5dfd455;border-radius:12px;padding:9px;background:#03131199;color:#fff;touch-action:auto;-webkit-user-select:text;user-select:text}
#message-send{font:16px system-ui;border:1px solid #a9dece66;border-radius:12px;padding:11px 12px;background:#1e4941;color:#e3fff5}

body.messages-open #control-bar{pointer-events:none}
#call-status{position:fixed;z-index:8;left:8px;top:85%;width:calc(var(--usable-width) - 16px);margin:0;padding:4px 9px;color:#c4eee3;background:#061713de;border-radius:10px;font:12px/1.25 system-ui;pointer-events:none;max-height:38px;overflow:hidden}
body.call-connected .glasses-frame{fill:#8bd7cb}
body.call-connected #call-status{opacity:0;visibility:hidden}
body.call-connected.call-status-visible #call-status{opacity:1;visibility:visible}
body.call-attention #call-status{opacity:1;visibility:visible}
#call-controls{position:fixed;z-index:9;left:8px;width:calc(var(--usable-width) - 16px);bottom:12px;display:flex;flex-wrap:wrap;gap:5px}
#call-controls button{flex:1;min-width:52px;border:1px solid #8cebdc55;border-radius:12px;padding:9px 5px;background:#0a2520ee;color:#c9f9ec;font:13px system-ui}
